version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: healthsense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./healthsense.db
      - SECRET_KEY=production-secure-random-secret-key-replace-in-real-env
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: healthsense-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
